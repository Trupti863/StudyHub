
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Note - StudyHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="top-bar">
    <div class="logo">
        <div class="logo-icon">📚</div>
        <div>
            <h2>StudyHub</h2>
            <span>Student Notes</span>
        </div>
    </div>
    <a href="{{ url_for('home') }}" class="back-button">← Back</a>
</header>

<main class="form-page">
    <div class="form-container">

        <div class="form-heading">
            <div class="form-icon">+</div>
            <div>
                <h1>Add New Note</h1>
                <p>Add your study material to StudyHub.</p>
            </div>
        </div>

        <form action="{{ url_for('add_note') }}"
              method="POST" enctype="multipart/form-data">

            <label for="title">Note Title</label>
            <input type="text" id="title" name="title"
                   placeholder="Example: Python Basics" maxlength="100" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject"
                   placeholder="Example: Python" maxlength="100" required>

            <label for="pdf_file">Upload PDF</label>

            <div class="upload-box">
                <div class="upload-icon">📄</div>
                <h3>Choose your PDF</h3>
                <p>PDF files only</p>
                <input type="file" id="pdf_file" name="pdf_file"
                       accept=".pdf,application/pdf" required>
            </div>

            <div class="form-buttons">
                <button type="submit" class="save-button">Save Note</button>
                <a href="{{ url_for('home') }}" class="cancel-button">Cancel</a>
            </div>
        </form>

    </div>
</main>

</body>
</html>
